openapi: 3.0.0
info:
  title: Codebreaker Solitaire API
  description: A logic-based game API for cracking secret codes, optimized for Java client portability.
  version: 4.1.2
servers:
  - url: https://ddc-java.services/codebreaker-solitaire
    description: Production server

paths:
  /games:
    post:
      summary: Start a new game
      operationId: startNewGame
      requestBody:
        description: Only 'pool' and 'length' are required for initialization.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Game'
      responses:
        '201':
          description: Game created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '400':
          $ref: '#/components/responses/BadRequest'

  /games/{gameId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Retrieve game status
      operationId: getGame
      responses:
        '200':
          description: Game details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Game'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a game session
      operationId: deleteGame
      responses:
        '204':
          description: Game deleted successfully

  /games/{gameId}/guesses:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Submit a guess
      operationId: submitGuess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guess'
      responses:
        '201':
          description: Guess processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guess'
        '409':
          description: Conflict - Game already solved

  /games/{gameId}/guesses/{guessId}:
    parameters:
      - name: gameId
        in: path
        required: true
        schema:
          type: string
      - name: guessId
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Retrieve a specific guess
      operationId: getGuess
      responses:
        '200':
          description: Guess details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Guess'

components:
  schemas:
    Game:
      type: object
      required:
        - pool
        - length
      properties:
        id:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        pool:
          type: string
          example: "ABCDEF"
        length:
          type: integer
          minimum: 1
          maximum: 20
          example: 4
        solved:
          type: boolean
          readOnly: true
        text:
          type: string
          description: The secret code (only returned if solved is true).
          readOnly: true
        guesses:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/Guess'

    Guess:
      type: object
      required:
        - text
      properties:
        id:
          type: string
          readOnly: true
        created:
          type: string
          format: date-time
          readOnly: true
        text:
          type: string
        exactMatches:
          type: integer
          readOnly: true
        nearMatches:
          type: integer
          readOnly: true
        solution:
          type: boolean
          readOnly: true

    Error:
      type: object
      properties:
        timestamp:
          type: string
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'